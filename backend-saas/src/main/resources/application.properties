# backend-saas (Fase 8): configuracion SOLO por entorno, nunca hardcoded.
# Dev (default): H2 en memoria con compatibilidad Postgres (la misma migracion
# BYTEA corre en ambos motores). Prod: variables SAAS_DB_* apuntando a Supabase.
spring.application.name=backend-saas
server.port=${SAAS_PORT:8080}

spring.datasource.url=${SAAS_DB_URL:jdbc:h2:mem:saas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SAAS_DB_USER:sa}
spring.datasource.password=${SAAS_DB_PWD:}
